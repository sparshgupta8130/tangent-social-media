<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Panditji Diwali reel</title>
<style>
  @font-face { font-family: 'Baloo'; src: url(assets/baloo.woff2) format('woff2'); font-weight: 400 800; }
  @font-face { font-family: 'Baloo'; src: url(assets/baloo-deva.woff2) format('woff2'); font-weight: 400 800; unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+25CC, U+A8E0-A8FF; }
  @font-face { font-family: 'Nunito'; src: url(assets/nunito.woff2) format('woff2'); font-weight: 200 1000; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #000; }
  #stage { position: relative; overflow: hidden; width: 1080px; height: 1920px; font-family: 'Baloo', sans-serif; }
  .abs { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; }
  .full { position: absolute; inset: 0; }
  #bgNight { background: radial-gradient(110% 70% at 50% 35%, #2a2456 0%, #17143a 55%, #0b0a1f 100%); }
  #bgWarm { background: radial-gradient(90% 60% at 50% 62%, #6b2350 0%, #3a1440 45%, #160a26 100%); opacity: 0; }
  #floor { background: radial-gradient(60% 18% at 50% 76%, rgba(255, 150, 50, 0.45) 0%, rgba(255, 150, 50, 0) 100%); opacity: 0; }
  #halo { width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 190, 90, 0.55) 0%, rgba(255, 150, 60, 0.18) 40%, rgba(255, 120, 40, 0) 70%); }
  .t1 { font-weight: 800; color: #fff4dc; font-size: 132px; line-height: 1; white-space: nowrap; letter-spacing: -0.01em; }
  .t2 { font-weight: 800; font-size: 236px; line-height: 1; white-space: nowrap; letter-spacing: -0.015em; padding: 0 20px;
        background: linear-gradient(180deg, #fff1b8 0%, #ffd166 38%, #ff9933 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .t3 { font-weight: 700; color: #ffcf8a; font-size: 84px; line-height: 1.2; white-space: nowrap; }
  .foot { font-family: 'Nunito'; font-weight: 800; color: rgba(255, 240, 220, 0.85); font-size: 40px; white-space: nowrap; }
  .foot2 { font-family: 'Nunito'; font-weight: 700; color: rgba(255, 240, 220, 0.55); font-size: 28px; white-space: nowrap; letter-spacing: 0.02em; }
  #mascotWrap { width: 680px; height: 680px; transform-origin: 50% 94%; }
  .diya { transform-origin: 50% 90%; }
</style>
</head>
<body>
<div id="stage">
  <div id="bgNight" class="full"></div>
  <canvas id="stars" class="full" width="1080" height="1920"></canvas>
  <div id="bgWarm" class="full"></div>
  <svg id="toran" class="abs" width="1080" height="320" viewBox="0 0 1080 320" overflow="visible"></svg>
  <canvas id="fw" class="full" width="1080" height="1920"></canvas>
  <div id="floor" class="full"></div>
  <div id="halo" class="abs"></div>

  <div id="tHappy" class="abs t1">Happy</div>
  <div id="tDiwali" class="abs t2">Diwali!</div>
  <div id="tHindi" class="abs t3">शुभ दीपावली</div>

  <div id="mascotWrap" class="abs"></div>
  <div id="d0" class="abs diya"></div>
  <div id="d1" class="abs diya"></div><div id="d2" class="abs diya"></div><div id="d3" class="abs diya"></div><div id="d4" class="abs diya"></div>

  <div id="foot" class="abs foot">with love, Panditji</div>
  <div id="foot2" class="abs foot2">@tangentideas.ai · animated with Claude</div>
</div>
<script src="lib.js"></script>
<script>
const W = 1080, H = 1920;
const mascot = makeMascot($('mascotWrap'), 'pj');
const MS = 680, MX = (W - MS) / 2, MY = 700;

// diyas: the big one in front, four smaller ones along the floor
const DIYAS = [
  { id: 'd0', x: 540, y: 1395, w: 300, lit: 0.3 },
  { id: 'd1', x: 150, y: 1470, w: 190, lit: 2.0 },
  { id: 'd2', x: 330, y: 1440, w: 170, lit: 2.125 },
  { id: 'd3', x: 750, y: 1440, w: 170, lit: 2.25 },
  { id: 'd4', x: 930, y: 1470, w: 190, lit: 2.375 },
];
const diyaSet = DIYAS.map((d) => { const el = $(d.id); el.style.width = d.w + 'px'; el.style.height = d.w * 170 / 220 + 'px'; return makeDiya(el, d.id + 'x'); });

// toran: three marigold swags with mango leaves
(function () {
  let s = '';
  const swags = [[-20, 60, 360, 40], [360, 40, 720, 40], [720, 40, 1100, 60]];
  for (const [x0, y0, x1, y1] of swags) {
    const n = 15;
    for (let i = 0; i <= n; i++) {
      const k = i / n, x = lerp(x0, x1, k), y = lerp(y0, y1, k) + Math.sin(Math.PI * k) * 120;
      s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="17" fill="${i % 2 ? '#ffb020' : '#ff8a1f'}"/><circle cx="${(x - 4).toFixed(1)}" cy="${(y - 5).toFixed(1)}" r="6" fill="#ffe08a" opacity="0.55"/>`;
    }
  }
  for (const x of [360, 720]) {
    s += `<path d="M${x} 40 q-26 50 0 96 q26-46 0-96z" fill="#2f8f4e"/><path d="M${x} 46 v86" stroke="#1f6b39" stroke-width="3"/>`;
    for (let j = 0; j < 3; j++) s += `<circle cx="${x}" cy="${150 + j * 30}" r="${14 - j * 2}" fill="${j % 2 ? '#ffb020' : '#ff8a1f'}"/>`;
  }
  $('toran').innerHTML = s;
})();

// stars
const sctx = $('stars').getContext('2d');
const R = rnd(5); const STARS = Array.from({ length: 140 }, () => ({ x: R() * W, y: R() * H * 0.75, r: 0.8 + R() * 2.4, p: R() * 6.28, sp: 1 + R() * 3 }));

// fireworks behind the title and the mascot
const BURSTS = makeBursts([
  { t0: 3.0, x: 190, y: 900, colors: ['#ffd166', '#fff1b8', '#ff9933'], n: 70, v: 270 },
  { t0: 3.75, x: 890, y: 820, colors: ['#ff7aa2', '#ffd166', '#ffffff'], n: 70, v: 280 },
  { t0: 4.5, x: 170, y: 1160, colors: ['#7ad7c4', '#ffd166', '#fff1b8'], n: 70, v: 260 },
  { t0: 5.5, x: 910, y: 1120, colors: ['#ffd166', '#ff9933'], n: 70, v: 260 },
  { t0: 6.25, x: 200, y: 860, colors: ['#ff7aa2', '#fff1b8'], n: 60, v: 250 },
  { t0: 7.25, x: 880, y: 900, colors: ['#ffd166', '#ff7aa2', '#7ad7c4', '#ffffff'], n: 80, v: 290 },
], 21);
const fctx = $('fw').getContext('2d');

function render(t) {
  // ---- background: night, warming on the drop
  const warm = eIO(seg(t, 1.95, 2.6));
  $('bgWarm').style.opacity = warm;
  sctx.clearRect(0, 0, W, H);
  for (const s of STARS) { sctx.globalAlpha = (0.35 + 0.55 * Math.max(0, Math.sin(s.p + t * s.sp * 2))) * (1 - 0.5 * warm); sctx.fillStyle = '#fff'; sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, 6.283); sctx.fill(); }
  sctx.globalAlpha = 1;
  $('floor').style.opacity = clamp(eOut(seg(t, 0.3, 0.9)) * 0.6 + warm * 0.4);

  // ---- toran drops in on the drop and sways
  const td = eSpring(seg(t, 2.0, 2.8));
  place($('toran'), { y: lerp(-340, 0, td), r: Math.sin(t * 2.2) * 0.6, o: t >= 2.0 ? 1 : 0 });

  // ---- fireworks
  fctx.clearRect(0, 0, W, H); drawBursts(fctx, BURSTS, t);

  // ---- halo behind Panditji from the big diya
  const lit0 = eOut(seg(t, 0.3, 0.55));
  place($('halo'), { x: (W - 900) / 2, y: 1060 - 450, s: 0.6 + 0.4 * lit0 + 0.03 * Math.sin(t * 9), o: lit0 * (0.75 + 0.25 * warm) });

  // ---- diyas
  DIYAS.forEach((d, i) => {
    const el = $(d.id); const h = d.w * 170 / 220;
    const pop = i === 0 ? eBack(seg(t, 0.0, 0.3)) : eBack(seg(t, d.lit - 0.08, d.lit + 0.12));
    const lit = eOut(seg(t, d.lit, d.lit + 0.2));
    const bob = i === 0 ? 0 : Math.sin(t * 3 + i) * 3;
    place(el, { x: d.x - d.w / 2, y: d.y - h / 2 + bob + (1 - pop) * 60, s: lerp(0.4, 1, pop) * (t >= d.lit && t < d.lit + 0.15 ? 1 + 0.08 * (1 - seg(t, d.lit, d.lit + 0.15)) : 1), o: pop });
    diyaSet[i](lit, t, i * 1.3);
  });

  // ---- Panditji
  // rises from behind the big diya, looks down at it, then up at us; namaste; joy on the drop; namaste to sign off
  const rise = eSpring(seg(t, 0.5, 1.25));
  let st = { arms: 'down', eyes: 'open', brows: 'normal', mouth: 'smile', px: 0, py: 4, tilt: 0, sparkle: 0, t };
  if (t < 1.05) { st.py = 5; st.px = 0; }
  else if (t < 1.5) { st.py = lerp(5, 0, seg(t, 1.05, 1.2)); st.mouth = 'o'; st.brows = 'up'; }
  else if (t < 2.0) { st.arms = 'namaste'; st.tilt = -5; }
  else if (t < 4.25) { st.arms = 'up'; st.eyes = 'happy'; st.brows = 'up'; st.mouth = 'open'; st.sparkle = eOut(seg(t, 2.0, 2.3)); st.blush = 1; }
  else if (t < 6.5) { st.arms = 'wave'; st.wave = Math.sin((t - 4.25) * 9) * 14; st.mouth = 'open'; st.brows = 'up'; st.blush = 0.6; st.tilt = Math.sin((t - 4.25) * 4.5) * 3; }
  else { st.arms = 'namaste'; st.tilt = -5; st.eyes = t > 7.0 ? 'happy' : 'open'; st.blush = 0.5; }
  st.blink = blinkAt(t, [1.8, 5.0, 6.8]);
  mascot(st);
  // squash-and-stretch on every pose change
  const hit = (a, d = 0.18) => (t >= a && t < a + d ? Math.sin(Math.PI * (t - a) / d) : 0);
  const sq = hit(1.5) * 0.06 + hit(2.0, 0.24) * 0.12 + hit(4.25) * 0.05 + hit(6.5) * 0.06;
  const bounce = t > 2.0 && t < 4.25 ? Math.abs(Math.sin((t - 2.0) * Math.PI * 2)) * 18 : 0; // hops on the beat
  const idle = Math.sin(t * 3) * 5;
  place($('mascotWrap'), { x: MX, y: MY + (1 - rise) * 1250 + idle - bounce, sx: 1 + sq, sy: 1 - sq, o: t >= 0.5 ? 1 : 0 });

  // ---- title
  const hIn = eBack(seg(t, 2.5, 2.72)), dIn = eBack(seg(t, 2.95, 3.2));
  const tH = $('tHappy'), tD = $('tDiwali'), tHi = $('tHindi');
  const glow = `drop-shadow(0 0 ${28 + 10 * Math.sin(t * 5)}px rgba(255, 170, 60, 0.75))`;
  place(tH, { x: centreX(tH, W), y: 250 - (1 - hIn) * 40, s: lerp(1.5, 1, hIn), o: hIn > 0 ? 1 : 0, filter: 'drop-shadow(0 6px 18px rgba(0,0,0,0.35))' });
  place(tD, { x: centreX(tD, W), y: 365, s: lerp(1.9, 1, dIn) * (1 + 0.012 * Math.sin(t * 6)), r: (1 - dIn) * -6, o: dIn > 0 ? 1 : 0, filter: glow });
  const hiIn = eOut(seg(t, 3.55, 3.85));
  place(tHi, { x: centreX(tHi, W), y: 620 + (1 - hiIn) * 30, o: hiIn });

  // ---- sign-off
  const f1 = eOut(seg(t, 6.6, 6.9)), f2 = eOut(seg(t, 6.8, 7.1));
  place($('foot'), { x: centreX($('foot'), W), y: 1580 + (1 - f1) * 20, o: f1 });
  place($('foot2'), { x: centreX($('foot2'), W), y: 1640 + (1 - f2) * 20, o: f2 });
}
window.render = render;
window.ready = document.fonts.ready.then(() => new Promise((r) => setTimeout(r, 300)));
render(0);
</script>
</body>
</html>
