<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=block');
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:#100f0d;color:#ece7de}
body{background:radial-gradient(120% 80% at 80% 0%, #221d18 0%, #100f0d 55%)}
.slide{position:relative;width:1080px;height:1350px;padding:96px 84px 0}
.top{display:flex;justify-content:space-between;align-items:center;font:600 24px Inter,sans-serif;
     letter-spacing:.16em;text-transform:uppercase;color:#ece7de;opacity:.75}
h1{margin:44px 0 0;font:400 68px/1.12 Fraunces,Georgia,serif;letter-spacing:-.01em;max-width:910px}
h1 em{font-style:normal;color:#e8a07a}
.body{margin:28px 0 0;font:400 36px/1.42 Inter,sans-serif;max-width:900px}
.foot{position:absolute;left:84px;right:84px;bottom:60px;display:flex;justify-content:space-between;
      align-items:center;font:500 26px Inter,sans-serif;color:#ece7de}
.foot .me{display:flex;gap:14px;align-items:center}
.swipe{font:600 26px Inter,sans-serif}

.cmp{margin-top:80px;background:#1b1916;border:2px solid #3a352d;border-radius:32px;padding:20px 40px 34px}
.row{display:flex;align-items:center;gap:28px;padding:26px 0;border-bottom:2px solid #3a352d}
.who{width:300px;font:600 34px Inter} .pos{font:400 34px Inter}
.ok{margin-top:30px;font:500 36px/1.3 Inter;display:flex;gap:18px;align-items:center}
.tick{color:#9fd39b;font:700 56px Inter}
</style></head>
<body><div class="slide">
<div class="top"><span>Building Panditji</span><span>5 / 7</span></div>

<h1>Then I checked my app&rsquo;s answers against <em>NASA&rsquo;s planet data.</em> They match.</h1>
<p class="body">Every answer also shows which planets it looked at, so you can check too.</p>
<div class="cmp">
  <div class="row"><span class="who">NASA&rsquo;s data</span><svg viewBox="0 0 64 64" width="70" height="70" fill="none" stroke="currentColor" stroke-width="3"><circle cx="32" cy="32" r="12"/><ellipse cx="32" cy="32" rx="28" ry="8" transform="rotate(-18 32 32)"/></svg><span class="pos">Saturn&rsquo;s position</span></div>
  <div class="row"><span class="who">Panditji</span><svg viewBox="0 0 64 64" width="70" height="70" fill="none" stroke="currentColor" stroke-width="3"><circle cx="32" cy="32" r="12"/><ellipse cx="32" cy="32" rx="28" ry="8" transform="rotate(-18 32 32)"/></svg><span class="pos">Saturn&rsquo;s position</span></div>
  <div class="ok"><span class="tick">&#10003;</span> The same, to within 1/3600 of a degree</div>
</div>

<div class="foot"><span class="me"><svg viewBox="0 0 120 120" fill="none" width="40" height="40">
<path d="M 52.26 25.06 A 25 25 0 1 1 45.45 26.5" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
<line x1="24" y1="82" x2="116.2" y2="62.4" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
<circle cx="59.2" cy="74.5" r="4.854" fill="currentColor"/></svg><span>@tangentideas.ai</span></span></div>
</div></body></html>
