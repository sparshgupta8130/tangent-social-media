<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400;500;600;700&display=block');
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden;color:#ece7de;
  background:radial-gradient(120% 80% at 80% 0%, #221d18 0%, #100f0d 55%) #100f0d}
.slide{width:1080px;height:1350px;padding:96px 84px 60px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;font:600 24px Inter;letter-spacing:.16em;
  text-transform:uppercase;opacity:.75}
h1{margin:48px 0 0;font:400 82px/1.1 Fraunces,Georgia,serif;letter-spacing:-.01em}
h1 em{font-style:normal;color:#e8a07a}
.viz{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.foot{display:flex;justify-content:space-between;align-items:center;font:500 26px Inter}
.foot .me{display:flex;gap:14px;align-items:center}
.bubble{border-radius:26px;padding:24px 30px;font:500 36px/1.3 Inter}
.q{background:#f6e7c8;color:#2a1f12} .a{background:#fffaf0;color:#1c1712}
.lbl{font:600 24px Inter;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
.card{background:#1b1916;border:2px solid #3a352d;border-radius:28px}
.cmp{width:100%;padding:16px 48px 40px}
.r{display:flex;align-items:center;gap:36px;padding:30px 0;border-bottom:2px solid #3a352d;font:600 44px Inter}
.r span:first-child{width:260px}
.ok{margin-top:34px;display:flex;align-items:center;gap:20px;font:600 46px Inter}
.tick{color:#9fd39b;font:700 66px Inter}</style></head><body>
<div class="slide"><div class="top"><span>Building Panditji</span><span>6 / 8</span></div>
<h1>Now its answers match <em>NASA&rsquo;s planet data.</em></h1><div class="viz"><div class="card cmp"><div class="r"><span>NASA</span><svg viewBox="0 0 64 64" width="84" height="84" fill="none" stroke="currentColor" stroke-width="3"><circle cx="32" cy="32" r="12"/><ellipse cx="32" cy="32" rx="28" ry="8" transform="rotate(-18 32 32)"/></svg><span>Saturn</span></div><div class="r"><span>Panditji</span><svg viewBox="0 0 64 64" width="84" height="84" fill="none" stroke="currentColor" stroke-width="3"><circle cx="32" cy="32" r="12"/><ellipse cx="32" cy="32" rx="28" ry="8" transform="rotate(-18 32 32)"/></svg><span>Saturn</span></div><div class="ok"><span class="tick">&#10003;</span>Same place</div></div></div>
<div class="foot"><span class="me"><svg viewBox="0 0 120 120" fill="none" width="40" height="40"><path d="M 52.26 25.06 A 25 25 0 1 1 45.45 26.5" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><line x1="24" y1="82" x2="116.2" y2="62.4" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><circle cx="59.2" cy="74.5" r="4.854" fill="currentColor"/></svg><span>@tangentideas.ai</span></span></div></div></body></html>
